name: Release

# Builds a universal Pullbell.app + DMG for a version tag and attaches it to a draft release.
# See MAINTAINING.md. Updater artifacts (latest.json + .sig) are produced only once the
# TAURI_SIGNING_PRIVATE_KEY secret exists and createUpdaterArtifacts is enabled.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      PULLBELL_CLIENT_ID: ${{ vars.PULLBELL_CLIENT_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: ./scripts/check.sh
      - name: Build universal app
        run: npm run tauri build -- --target universal-apple-darwin
      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          dir=src-tauri/target/universal-apple-darwin/release/bundle
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "Pullbell $tag" --notes "Release notes to follow."
          gh release upload "$tag" "$dir"/dmg/*.dmg --clobber
          if ls "$dir"/macos/*.tar.gz >/dev/null 2>&1; then
            gh release upload "$tag" "$dir"/macos/*.tar.gz "$dir"/macos/*.tar.gz.sig --clobber
          fi
