[package]
name = "pullbell"
version = "0.1.1"
description = "A menu bar GitHub inbox"
authors = ["Aaron Sun"]
license = "MIT"
repository = "https://github.com/aaronsuns/pullbell"
edition = "2021"
rust-version = "1.80"

[lib]
name = "pullbell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "process"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
log = "0.4"
thiserror = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
mac-notification-sys = "0.6"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
